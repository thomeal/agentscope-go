<svg xmlns="http://www.w3.org/2000/svg" width="940" height="342" viewBox="0 0 940 342" role="img" aria-label="Both summaries come from forks of the cloud master's last request. The own-notes fork edits the cloud's notes, which the agent holds and installs at its compaction line without a model call. The peer fork writes a summary entry for the edge, which replaces the edge's context at a takeover. Notes are offered only once a peer summary covers their snapshot.">
<style>
.bg{fill:#FFFFFF;stroke:#D3D9E1;stroke-width:1}
.box{fill:#FFFFFF;stroke:#556273;stroke-width:1.2}
.plain{fill:#E9EDF2;stroke:#C5CDD7;stroke-width:1}
.cloud{fill:#E6ECFB;stroke:#2650BD;stroke-width:1.2}
.edge{fill:#DDF2EE;stroke:#0A7566;stroke-width:1.2}
.jev{fill:#F7ECD6;stroke:#935A04;stroke-width:1.2}
.alert{fill:#FAE7E5;stroke:#AE261D;stroke-width:1.2}
.l{stroke:#556273;stroke-width:1.3;fill:none}
.lc{stroke:#2650BD;stroke-width:1.3;fill:none}
.le{stroke:#0A7566;stroke-width:1.3;fill:none}
.la{stroke:#AE261D;stroke-width:1.5;fill:none}
.dash{stroke:#8A96A5;stroke-width:1;stroke-dasharray:4 4;fill:none}
.t{fill:#17202B;font:400 12.5px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif}
.tb{fill:#17202B;font:700 13px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif}
.ts{fill:#556273;font:400 11.5px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif}
.tm{fill:#17202B;font:400 11px 'SFMono-Regular', Consolas, Menlo, monospace}
.tms{fill:#556273;font:400 10.5px 'SFMono-Regular', Consolas, Menlo, monospace}
.ta{fill:#AE261D;font:500 11.5px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif}
.tc{fill:#2650BD;font:700 13px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif}
.te{fill:#0A7566;font:700 13px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#556273"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="939" height="341" rx="6"/>
<text class="ts" x="20" y="24">Cloud master: its last request, cached by the provider</text>
<rect class="cloud" x="20" y="34" width="660" height="44" rx="4"/>
<text class="tb" x="350" y="61" text-anchor="middle">Snapshot: the last request (system prompt + tools + messages)</text>
<line class="l" x1="680" y1="56" x2="730" y2="56" marker-end="url(#a)"/>
<rect class="box" x="730" y="34" width="190" height="44" rx="4"/>
<text class="t" x="825" y="61" text-anchor="middle">main loop continues</text>
<line class="lc" x1="170" y1="78" x2="170" y2="124" marker-end="url(#a)"/>
<text class="ts" x="180" y="106">same snapshot</text>
<line class="lc" x1="512" y1="78" x2="512" y2="124" marker-end="url(#a)"/>
<text class="ts" x="522" y="106">same snapshot</text>
<rect class="box" x="20" y="124" width="300" height="80" rx="4"/>
<text class="tb" x="36" y="147">Own-notes fork</text>
<text class="t" x="36" y="169">first at 10K input tokens, then every 5K</text>
<text class="ts" x="36" y="190">FIND/REPLACE edits of the notes; no tools</text>
<rect class="box" x="345" y="124" width="335" height="80" rx="4"/>
<text class="tb" x="361" y="147">Peer fork, for the edge</text>
<text class="t" x="361" y="169">at 80% of the edge window, and on a transfer</text>
<text class="ts" x="361" y="190">one instruction appended; no tools</text>
<line class="lc" x1="170" y1="204" x2="170" y2="260" marker-end="url(#a)"/>
<text class="ts" x="162" y="236" text-anchor="end">OfferSummary</text>
<line class="lc" x1="512" y1="204" x2="512" y2="260" marker-end="url(#a)"/>
<text class="ts" x="522" y="236">appended by the Coordinator</text>
<line class="dash" x1="508" y1="250" x2="176" y2="250" marker-end="url(#a)"/>
<text class="ts" x="341" y="222" text-anchor="middle">notes are offered only once a peer</text>
<text class="ts" x="341" y="238" text-anchor="middle">summary covers their snapshot</text>
<rect class="cloud" x="20" y="260" width="300" height="62" rx="4"/>
<text class="t" x="170" y="286" text-anchor="middle">Held in the agent state</text>
<text class="ts" x="170" y="306" text-anchor="middle">installed at the compaction line, no model call</text>
<rect class="jev" x="345" y="260" width="335" height="62" rx="4"/>
<text class="tm" x="512" y="286" text-anchor="middle">#N summary · Target=edge</text>
<text class="ts" x="512" y="306" text-anchor="middle">Coverage recorded by the Coordinator</text>
<line class="le" x1="680" y1="291" x2="740" y2="291" marker-end="url(#a)"/>
<text class="ts" x="710" y="283" text-anchor="middle">clear rule</text>
<rect class="edge" x="740" y="260" width="180" height="62" rx="4"/>
<text class="tb" x="830" y="286" text-anchor="middle">Edge agent</text>
<text class="ts" x="830" y="306" text-anchor="middle">summary + uncovered entries</text>
</svg>
