<svg xmlns="http://www.w3.org/2000/svg" width="940" height="536" viewBox="0 0 940 536" role="img" aria-label="The user reaches the session through the Coordinator, which asks the router and classifier for an owner and appends every entry to the Main Thread. The edge and cloud participants import entries past their cursors and publish through the Coordinator. The cloud participant holds a master and two members; only the master touches the log.">
<style>
.bg{fill:#FFFFFF;stroke:#D3D9E1;stroke-width:1}
.box{fill:#FFFFFF;stroke:#556273;stroke-width:1.2}
